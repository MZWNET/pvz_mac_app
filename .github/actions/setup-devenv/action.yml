name: Set up devenv
description: Installs Nix pointed at the devenv cache, plus the devenv CLI.

runs:
  using: composite
  steps:
    - uses: DeterminateSystems/nix-installer-action@v23
    - uses: cachix/cachix-action@v17
      with:
        name: devenv
    - name: Install devenv
      shell: bash
      run: nix profile install nixpkgs#devenv
