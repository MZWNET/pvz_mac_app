name: PvZPortable

options:
  bundleIdPrefix: io.github.wszqkzqk
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    macOS: "13.0"

settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    # real values are injected by build-app.sh from build-info.json
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  PvZPortable:
    type: application
    platform: macOS
    settings:
      base:
        PRODUCT_NAME: PvZ Portable
        PRODUCT_BUNDLE_IDENTIFIER: io.github.wszqkzqk.pvz-portable
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: launcher/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - path: launcher
        excludes:
          - Info.plist
    postBuildScripts:
      # a build phase rather than only build-app.sh, so ⌘R in Xcode also produces a complete app
      - name: Embed PvZ-Portable engine
        script: '"$PROJECT_DIR/scripts/embed-engine.sh"'
        basedOnDependencyAnalysis: false
